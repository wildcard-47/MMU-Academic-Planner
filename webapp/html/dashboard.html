<html>
    <head>
        <title>Dashboard</title>
        <link rel="stylesheet" href="html/css/style.css">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" href="/html/logo-mmu2x.png">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    </head>
    <body>

 <header>
  <a href="/dashboard" class="logo-container">
    <img src="/html/logo-mmu2x.png" alt="Multimedia University Logo" class="logo-img">
    <div class="logo-divider"></div>
    <span class="logo-subtitle">Academic Planner</span>
  </a>
  <nav class="nav-links" id="nav"></nav>
</header>

  <h1>Academic Dashboard</h1>

  <div id="subjects-list"></div>
  <div id="summary" class="card"></div>
    </body>
    <script src="/html/js/api.js"></script>
    <script>
        function colorFor(score) {
  if (score >= 70) return "green";
  if (score >= 50) return "yellow";
  return "red";
}

async function loadDashboard() {
  const data = await apiGet("/api/dashboard");
  const list = document.getElementById("subjects-list");
  list.innerHTML = "";

  if (data.subjects.length === 0) {
    list.innerHTML = "<p>No subjects yet — add one in the Subjects tab.</p>";
  }

  data.subjects.forEach((s) => {
    const row = document.createElement("div");
    row.className = "card";
    const pct = Math.max(0, Math.min(s.score, 100));
    row.innerHTML = `
       <b><span class="subject-icon">${iconForSubject(s.name)}</span>${s.name} (${s.code})</b>
      — ${s.score.toFixed(1)}%
      <span class="grade-badge" style="background:${badgeColorFor(s.letter)}">${s.letter}</span>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" style="width:${pct}%; background:${colorFor(s.score)}"></div>
      </div>
  <p class="comparison-text">${comparisonText}</p>
`;
    list.appendChild(row);
  });

  const summary = document.getElementById("summary");
  if (data.subjects.length === 0) {
    summary.innerHTML = "";
    return;
  }
  summary.innerHTML = `
    <p><b>Overall Average: ${data.average.toFixed(1)}%</b></p>
    ${data.highest ? `<p>Highest: ${data.highest.name} - ${data.highest.score.toFixed(1)}%</p>` : ""}
    ${data.lowest ? `<p>Lowest: ${data.lowest.name} - ${data.lowest.score.toFixed(1)}%</p>` : ""}
  `;
}

document.addEventListener("DOMContentLoaded", async () => {
  const user = await requireAuth();
  if (!user) return;
  await loadDashboard();
});
    </script>
</html>
