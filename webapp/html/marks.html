<html>
    <head>
        <title>Marks</title>
        <link rel="stylesheet" href="html/css/style.css">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" href="/html/logo-mmu2x.png">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
        <style>
          .subject-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
          }
          .subject-title {
            font-family: 'Poppins', sans-serif;
            font-size: 1.15rem;
            font-weight: 600;
            color: #1d2939;
          }
          .current-score {
            font-weight: 600;
            color: #344054;
          }
          .marks-table {
            margin-top: 10px;
          }
          .marks-table th {
            font-size: 0.8rem;
            color: #667085;
            font-weight: 600;
          }
          .marks-table td.weight-cell {
            color: #667085;
            font-weight: 600;
            width: 80px;
          }
          .marks-table input {
            width: 100px;
          }
          .marks-table input.invalid {
            border-color: var(--error-red);
          }
          .card-footer {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
          }
          .save-status {
            font-size: 0.85rem;
            color: var(--text-muted);
          }
          .save-status.ok {
            color: var(--success-green);
          }
          .save-status.error {
            color: var(--error-red);
          }
        </style>
    </head>
    <body>

<header>
  <a href="/dashboard" class="logo-container">
    <img src="/html/logo-mmu2x.png" alt="Multimedia University Logo" class="logo-img">
    <div class="logo-divider"></div>
    <span class="logo-subtitle">Academic Planner</span>
  </a>
  <nav class="nav-links" id="nav"></nav>
</header>

<h1>✏️ My Marks</h1>
<p class="comparison-text" style="margin-bottom: 1.5rem;">
  Enter the mark (0–100%) you got for each assessment. Leave a box empty if it isn't marked yet.
</p>

<div id="marks-list"></div>

    </body>
  <script src="/html/js/api.js"></script>
<script>

  // savedCode: the subject just saved, so its card can show a confirmation.
  async function loadMarks(savedCode) {
    const subjects = await apiGet("/api/marks");
    const list = document.getElementById("marks-list");
    list.innerHTML = "";

    if (subjects.length === 0) {
      list.innerHTML = "<p>No assessments yet — add subjects and assessments in the Subjects tab first.</p>";
      return;
    }

    for (const subject of subjects) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="subject-header">
          <span class="subject-title">${iconForSubject(subject.name)} ${subject.name} <span style="color:#98a2b3">(${subject.code})</span></span>
          <span class="current-score">${renderCurrent(subject.summary)}</span>
        </div>
        <p class="comparison-text">${subject.summary.completed_weight}% of the grade marked so far</p>
        <table class="marks-table">
          <tr><th>Assessment</th><th>Weight</th><th>Mark %</th></tr>
          ${subject.assessments.map((a) => `
            <tr>
              <td>${a.name}</td>
              <td class="weight-cell">${a.weight}%</td>
              <td>
                <input type="number" min="0" max="100" step="0.01" placeholder="Not marked"
                       data-id="${a.id}" data-original="${a.score ?? ""}" value="${a.score ?? ""}">
              </td>
            </tr>
          `).join("")}
        </table>
        <div class="card-footer">
          <button class="save-btn">Save marks</button>
          <span class="save-status"></span>
        </div>
      `;
      card.querySelector(".save-btn").onclick = () => saveMarks(card, subject.code);
      if (subject.code === savedCode) {
        const status = card.querySelector(".save-status");
        status.className = "save-status ok";
        status.textContent = "Marks saved ✓";
      }
      list.appendChild(card);
    }
  }

  function renderCurrent(summary) {
    if (summary.current === null) return "No marks yet";
    return `Current: ${summary.current.toFixed(1)}%
      <span class="grade-badge" style="background:${badgeColorFor(summary.letter)}">${summary.letter}</span>`;
  }

  // Saves only the inputs that changed. An empty box clears the mark.
  async function saveMarks(card, subCode) {
    const status = card.querySelector(".save-status");
    status.className = "save-status";
    status.textContent = "";

    const inputs = [...card.querySelectorAll("input[data-id]")];
    const changed = inputs.filter((input) => input.value.trim() !== input.dataset.original);

    let hasError = false;
    for (const input of inputs) {
      const value = input.value.trim();
      const invalid = value !== "" && (isNaN(Number(value)) || Number(value) < 0 || Number(value) > 100);
      input.classList.toggle("invalid", invalid);
      if (invalid) hasError = true;
    }
    if (hasError) {
      status.className = "save-status error";
      status.textContent = "Marks must be between 0 and 100.";
      return;
    }
    if (changed.length === 0) {
      status.textContent = "Nothing to save.";
      return;
    }

    try {
      for (const input of changed) {
        const value = input.value.trim();
        await apiPut(`/api/marks/${input.dataset.id}`, { score: value === "" ? null : Number(value) });
      }
      await loadMarks(subCode);
    } catch (err) {
      status.className = "save-status error";
      status.textContent = err.message;
    }
  }

  document.addEventListener("DOMContentLoaded", async () => {
    const user = await requireAuth();
    if (!user) return;
    await loadMarks();
  });
</script>
</html>
